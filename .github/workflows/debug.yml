name: Build Debug APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Build Target and Observer
        run: |
          gradle --no-daemon \
            :target-app:assembleDebug \
            :observer-app:assembleDebug

      - name: Upload Target APK
        uses: actions/upload-artifact@v4
        with:
          name: target-debug-apk
          path: target-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Observer APK
        uses: actions/upload-artifact@v4
        with:
          name: observer-debug-apk
          path: observer-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
