name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          chmod 600 "$RUNNER_TEMP/upload-key.jks"

      - name: Build signed release APKs
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-key.jks
        run: |
          gradle :target-app:assembleRelease :observer-app:assembleRelease \
            --no-daemon --stacktrace

      - name: Create SHA-256 checksums
        run: |
          sha256sum \
            target-app/build/outputs/apk/release/target-app-release.apk \
            > target-app/build/outputs/apk/release/target-app-release.apk.sha256
          sha256sum \
            observer-app/build/outputs/apk/release/observer-app-release.apk \
            > observer-app/build/outputs/apk/release/observer-app-release.apk.sha256

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: consent-screen-share-apks
          path: |
            target-app/build/outputs/apk/release/target-app-release.apk
            target-app/build/outputs/apk/release/target-app-release.apk.sha256
            observer-app/build/outputs/apk/release/observer-app-release.apk
            observer-app/build/outputs/apk/release/observer-app-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target-app/build/outputs/apk/release/target-app-release.apk
            target-app/build/outputs/apk/release/target-app-release.apk.sha256
            observer-app/build/outputs/apk/release/observer-app-release.apk
            observer-app/build/outputs/apk/release/observer-app-release.apk.sha256